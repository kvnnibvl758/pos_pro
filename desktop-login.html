<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Retour vers POS Pro</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f5f7; color: #1f2933; font-family: system-ui, sans-serif; }
    main { max-width: 420px; padding: 24px; text-align: center; }
    a.btn { display: inline-block; margin-top: 16px; padding: 12px 20px; border-radius: 8px; background: #1f6feb; color: #fff; text-decoration: none; font-weight: 600; }
    p { line-height: 1.5; }
    @media (prefers-color-scheme: dark) { body { background: #14181d; color: #e6e9ec; } }
  </style>
</head>
<body>
  <main>
    <h1>Connexion réussie</h1>
    <p id="msg">Retour vers l’application POS Pro…</p>
    <a id="open" class="btn" href="pospro://auth" hidden>Ouvrir POS Pro</a>
    <p><small>Si votre navigateur demande l’autorisation d’ouvrir POS Pro, acceptez. Vous pourrez ensuite fermer cet onglet.</small></p>
  </main>
  <script src="desktop-login.js"></script>
</body>
</html>
